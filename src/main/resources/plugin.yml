name: HuhobotMonitor
version: '${version}'
main: org.huhobot.monitor.HuhobotMonitorPlugin
description: 为 HuHoBot 生成服务器实时性能监控图片
authors:
  - HuhobotMonitor Contributors
api-version: '1.16'
load: POSTWORLD
depend:
  - HuHoBotPenguin
commands:
  huhobotmonitor:
    description: HuHoBot 性能监控附属插件管理与预览命令
    usage: /huhobotmonitor [preview [healthy|warning|critical|unavailable]]
permissions:
  huhobotmonitor.admin:
    description: 允许生成性能监控测试预览
    default: op
